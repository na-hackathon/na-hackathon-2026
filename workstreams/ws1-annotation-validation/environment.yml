# ws1-dev: toolchain for developing WS1 (Nextflow + JVM, nf-test, pytest, gemmi).
# Pipeline processes run in envs/ws1.yml, which Nextflow builds on first use
# into the conda cache shared by runs and tests (NXF_CONDA_CACHEDIR, default ~/.cache/ws1-conda).
#
#   mamba env create -f environment.yml      # (or: conda env create -f ...)
#   conda activate ws1-dev
name: ws1-dev
channels:
  - conda-forge
  - bioconda
dependencies:
  - python>=3.10
  - openjdk>=17          # Nextflow runtime (JVM)
  - nextflow>=24.04      # workflow engine
  - gemmi                # mmCIF/PDB IO for parser + validator development
  - nf-test              # pipeline tests
  - pytest               # unit tests (tests/test_*.py)
# Dependencies of maxit, FR3D, RNApolis and forgi are in envs/ws1.yml.
